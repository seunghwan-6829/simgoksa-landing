<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>운명 사용설명서 — 深谷寺</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050404">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050404; --bg2:#0d0908; --ink:#e8e0d8; --ink-dim:#9a8f85;
  --blood:#a4161a; --blood-bright:#e5383b; --ember:#d08c3a; --paper:#e8ddc7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:#000;color:var(--ink);
  font-family:'Noto Serif KR','Nanum Myeongjo',serif;
}
.grain{
  pointer-events:none;position:fixed;inset:-100%;width:300%;height:300%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  opacity:.06;z-index:90;
}
#frame{
  position:fixed;inset:0;max-width:480px;margin:0 auto;
  background:var(--bg);display:flex;flex-direction:column;
}
/* ── top bar ── */
#topbar{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;
  border-bottom:1px solid rgba(232,224,216,.07);
  background:rgba(5,4,4,.92);z-index:10;
}
#topbar .t-brand{font-family:'Nanum Myeongjo',serif;font-size:13px;letter-spacing:.25em;color:var(--ember)}
#topbar .t-page{font-size:12px;letter-spacing:.15em;color:var(--ink-dim)}
#topbar button{
  appearance:none;background:none;border:1px solid rgba(232,224,216,.2);border-radius:999px;
  color:var(--ink-dim);font-family:inherit;font-size:11.5px;letter-spacing:.1em;
  padding:6px 13px;cursor:pointer;
}
#progress{flex:none;height:2px;background:rgba(232,224,216,.08)}
#progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--blood),var(--blood-bright));transition:width .3s ease}
/* ── pager (JS 제어 — 스와이프당 무조건 1장) ── */
#pager{
  flex:1;overflow:hidden;position:relative;
  touch-action:pan-y; /* 세로 스크롤은 브라우저, 가로 넘김은 JS */
}
#track{
  display:flex;height:100%;
  transition:transform .38s cubic-bezier(.22,.8,.3,1);
  will-change:transform;
}
.page{
  flex:none;width:100%;height:100%;
  overflow-y:auto;scrollbar-width:none;
  padding:34px 28px 60px;
  position:relative;
}
.page::-webkit-scrollbar{display:none}
/* ── page typography ── */
.pg-no{
  font-family:'Nanum Myeongjo',serif;font-size:11px;letter-spacing:.3em;color:#5c534c;
  text-align:center;margin-bottom:26px;
}
.pg-label{font-size:12px;letter-spacing:.3em;color:var(--blood-bright);text-align:center;margin-bottom:14px}
h2.pg-title{
  font-size:23px;font-weight:900;line-height:1.7;text-align:center;word-break:keep-all;margin-bottom:8px;
}
h2.pg-title .r{color:var(--blood-bright)}
.pg-hanja{
  font-family:'Nanum Myeongjo',serif;font-size:46px;font-weight:800;color:var(--blood);
  text-align:center;margin:20px 0 6px;text-shadow:0 0 34px rgba(164,22,26,.35);
}
.pg-sub{font-size:13px;color:var(--ink-dim);text-align:center;letter-spacing:.12em;margin-bottom:26px}
.pg-body{font-size:15.5px;line-height:2.15;word-break:keep-all;color:var(--ink)}
.pg-body + .pg-body{margin-top:18px}
.pg-body em{font-style:normal;color:var(--blood-bright);font-weight:700}
.pg-body b{color:var(--paper)}
.pg-quote{
  margin:26px 0;padding:18px 20px;border-left:2px solid var(--blood);
  background:rgba(164,22,26,.06);font-size:15px;line-height:2.05;word-break:keep-all;
}
.pg-note{margin-top:26px;font-size:12px;color:#6b5f57;line-height:1.9;text-align:center;word-break:keep-all}
.hr{width:44px;height:1px;background:rgba(208,140,58,.5);margin:26px auto}
/* cover */
.cover{padding:0!important;display:flex;flex-direction:column}
.cover .cv-img{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.72) saturate(.85)}
.cover .cv-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 30%,transparent 55%,rgba(3,2,2,.96) 92%)}
.cover .cv-inner{position:relative;margin-top:auto;padding:0 30px calc(env(safe-area-inset-bottom,0px) + 70px);text-align:center}
.cover .cv-brand{font-family:'Nanum Myeongjo',serif;font-size:13px;letter-spacing:.5em;color:var(--ember);text-shadow:0 2px 8px #000}
.cover .cv-title{font-family:'Nanum Myeongjo',serif;font-size:34px;font-weight:800;color:var(--paper);margin:14px 0 6px;text-shadow:0 2px 6px rgba(0,0,0,.95),0 4px 20px #000}
.cover .cv-name{font-size:16px;color:var(--ink);letter-spacing:.2em;text-shadow:0 2px 8px #000}
.cover .cv-zodiac{margin-top:14px;font-size:12px;letter-spacing:.3em;color:var(--ink-dim);text-shadow:0 2px 8px #000}
/* 간지(divider) */
.divider{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.divider .dv-hanja{font-family:'Nanum Myeongjo',serif;font-size:72px;font-weight:800;color:rgba(164,22,26,.8);text-shadow:0 0 50px rgba(164,22,26,.4)}
.divider .dv-t{margin-top:18px;font-size:17px;font-weight:700;letter-spacing:.2em;color:var(--paper)}
.divider .dv-s{margin-top:10px;font-size:12.5px;letter-spacing:.15em;color:var(--ink-dim);line-height:2}
.divider .dv-line{width:1px;height:60px;background:linear-gradient(180deg,transparent,var(--blood),transparent);margin-top:26px}
/* 원국 표 */
.gv-pillars{display:flex;gap:8px;justify-content:center;margin:24px 0 8px}
.gv-p{flex:1;max-width:86px;border:1px solid rgba(232,224,216,.14);border-radius:4px;background:rgba(20,14,12,.6);padding:12px 4px;text-align:center}
.gv-p .l{font-size:10px;letter-spacing:.2em;color:var(--ink-dim);margin-bottom:8px}
.gv-p .c{font-family:'Nanum Myeongjo',serif;font-size:26px;line-height:1.4;color:var(--paper)}
.gv-p.hot{border-color:rgba(229,56,59,.55);box-shadow:0 0 18px rgba(164,22,26,.25)}
/* toc */
.toc-list{margin-top:10px}
.toc-item{
  display:flex;gap:12px;align-items:baseline;padding:11px 4px;
  border-bottom:1px dashed rgba(232,224,216,.08);cursor:pointer;
}
.toc-item .n{font-family:'Nanum Myeongjo',serif;font-size:13px;color:var(--ember);white-space:nowrap}
.toc-item .x{font-size:13.5px;color:var(--ink);line-height:1.6;word-break:keep-all}
.toc-item .p{margin-left:auto;font-size:11px;color:#5c534c;white-space:nowrap}
/* 탭 존 (이전/다음) */
#tapPrev,#tapNext{position:fixed;top:120px;bottom:60px;width:20%;z-index:5}
#tapPrev{left:0}
#tapNext{right:0}
/* 목차 오버레이 */
#tocOverlay{
  position:fixed;inset:0;z-index:120;display:none;
  background:rgba(3,2,2,.94);backdrop-filter:blur(8px);
  overflow-y:auto;padding:70px 28px 60px;
}
#tocOverlay.on{display:block}
#tocOverlay .close{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:18px;
  appearance:none;background:none;border:none;color:var(--ink-dim);font-size:22px;cursor:pointer;
}
#tocOverlay h3{font-family:'Nanum Myeongjo',serif;font-size:15px;letter-spacing:.3em;color:var(--ember);text-align:center;margin-bottom:20px}
/* 데모 배너 */
#demoBar{
  display:none;flex:none;text-align:center;font-size:11px;letter-spacing:.15em;
  color:#ffd9a0;background:rgba(120,60,10,.35);padding:7px 10px;
}
@media (min-width:768px){
  body::before{content:"";position:fixed;inset:-40px;z-index:-1;
    background:url('../assets/ritual.jpg') center/cover no-repeat;filter:blur(46px) brightness(.2)}
  #frame{border-left:1px solid rgba(232,224,216,.08);border-right:1px solid rgba(232,224,216,.08)}
}
</style>
</head>
<body>
<div class="grain"></div>
<div id="frame">
  <div id="topbar">
    <a class="t-brand" href="../" style="text-decoration:none" title="심곡사 메인으로">⌂ 深谷寺</a>
    <span class="t-page" id="pageNo">第 1 章 / 99</span>
    <button onclick="openToc()">목차</button>
  </div>
  <div id="progress"><div id="progressBar"></div></div>
  <div id="demoBar">미리보기 — 실제 구매 시 본인 원국 기준으로 작성됩니다</div>
  <div id="pager"></div>
</div>
<div id="tapPrev"></div>
<div id="tapNext"></div>
<div id="tocOverlay">
  <button class="close" onclick="closeToc()">✕</button>
  <h3>차 례</h3>
  <div class="toc-list" id="tocList"></div>
</div>

<script>
/* ═══════════ 입력 데이터 ═══════════ */
const qs = new URLSearchParams(location.search);
let user = null;
if (qs.get('name') || qs.get('demo')){
  user = { name: qs.get('name') || '김심곡', birth: {y:+(qs.get('y')||1995), m:+(qs.get('m')||3), d:+(qs.get('d')||14)}, gender: qs.get('g') || '여' };
  if (qs.get('demo')) document.getElementById('demoBar').style.display = 'block';
} else {
  try{
    const raw = localStorage.getItem('sgs_myodam');
    if (raw){ const d = JSON.parse(raw); if (d && d.name && d.birth) user = d; }
  }catch(e){}
}
if (!user){ location.href = '../myodam/'; }

/* ═══════════ 사주 계산 ═══════════ */
const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const STEM_KO = ['갑','을','병','정','무','기','경','신','임','계'];
const STEM_EL = ['나무','나무','불','불','흙','흙','쇠','쇠','물','물'];
const STEM_SIDE = ['큰 나무','굽은 덩굴','타오르는 해','등잔의 불','산의 흙','밭의 흙','벼린 칼','다듬은 옥','큰 강물','이슬비'];
const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const ZODIAC_KO = ['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
const ZODIAC_FILE = ['rat','ox','tiger','rabbit','dragon','snake','horse','goat','monkey','rooster','dog','pig'];

const y = user.birth.y;
const yStemIdx = (y - 4) % 10;
const yBranchIdx = (y - 4) % 12;
const yearPillar = STEMS[yStemIdx] + BRANCHES[yBranchIdx];
const zodiac = ZODIAC_KO[yBranchIdx];
const zodiacImg = '../assets/zodiac/' + ZODIAC_FILE[yBranchIdx] + '.jpg';
const nowY = new Date().getFullYear();
const age = nowY - y + 1;

function hashUser(){
  const s = user.name + y + user.birth.m + user.birth.d + user.gender;
  let h = 0; for (let i = 0; i < s.length; i++){ h = ((h<<5)-h+s.charCodeAt(i))|0; }
  return Math.abs(h);
}
const H = hashUser();

/* 살 선택 — 랜딩과 동일 로직 (결과 일치) */
const SAL_POOL = [
  {h:'鬼', name:'귀문관살', hanja:'鬼門關殺', desc:'정신과 영(靈)의 경계가 좁아진 자리. 까닭 없는 불면과 예민함, 반복되는 가위눌림.', root:'마음', gift:'남들이 못 보는 것을 먼저 알아채는 직관'},
  {h:'白', name:'백호살', hanja:'白虎殺', desc:'피와 구설을 부르는 살. 가까운 사람과의 갈등, 예기치 못한 사고수.', root:'몸', gift:'위기 앞에서 오히려 침착해지는 담력'},
  {h:'怨', name:'원진살', hanja:'怨嗔殺', desc:'까닭 없이 서로를 미워하게 만드는 살. 인연이 늘 같은 자리에서 어긋난다.', root:'인연', gift:'한 번 맺으면 끝까지 지키는 깊은 정'},
  {h:'孤', name:'고신살', hanja:'孤辰殺', desc:'군중 속에서도 혼자가 되는 살. 관계가 깊어질수록 먼저 거리를 두게 된다.', root:'외로움', gift:'홀로 있는 시간에 여물어지는 내공'},
  {h:'驛', name:'역마살', hanja:'驛馬殺', desc:'한 곳에 뿌리내리지 못하게 흔드는 살. 이직과 이사, 이별이 잦다.', root:'길', gift:'낯선 곳에서도 길을 여는 개척의 힘'},
  {h:'桃', name:'도화살', hanja:'桃花殺', desc:'사람을 끌어당기는 힘이자, 구설을 부르는 칼.', root:'매력', gift:'다루기만 하면 사람이 모이는 인력(引力)'}
];
const salCount = 2 + ((H >> 5) % 2);
const sals = [];
(function(){
  let idx = H % SAL_POOL.length;
  const step = ((H >> 7) % 2) ? 5 : 1;
  while (sals.length < salCount){
    if (!sals.includes(SAL_POOL[idx])) sals.push(SAL_POOL[idx]);
    idx = (idx + step) % SAL_POOL.length;
  }
})();

/* 개인화 연도 */
const pastY = nowY - 2 - (H % 3);
const midY = nowY + 1 + ((H >> 3) % 2);
const bigY = nowY + 3 + ((H >> 6) % 3);
const nm = user.name;
const honor = user.gender === '여' ? '그녀' : '그';

/* ═══════════ PART 1 변형 — 뿌리 기질 (년간 10종) ═══════════ */
const P1 = [
 {t:'큰 나무의 팔자', body:[
  `${nm}. 네 뿌리는 <em>갑목(甲木)</em>— 곧게 자라는 큰 나무다. 휘어지는 법을 모르고, 꺾이면 꺾였지 굽히지는 않는 팔자.`,
  `그래서 너는 늘 <b>먼저 나서는 자리</b>에 서게 된다. 시키지 않아도 짐을 지고, 남의 몫까지 어깨에 올린다. 문제는— 나무가 클수록 바람을 많이 맞는다는 것이다.`,
  `네가 지금껏 받아 온 시기와 견제는, 네가 못나서가 아니라 <em>네 그림자가 길어서</em>다.`],
  shadow:[`큰 나무의 그늘— 그 아래 있는 사람들은 시원하지만, 정작 나무 자신은 제 그늘을 못 쓴다. 너는 남을 돌보면서 <b>네 몫의 쉼을 늘 뒤로 미뤄 왔다.`,
  `조심해야 할 것은 부러짐이다. 갑목은 휘지 않으니, 한계가 오면 소리 없이 <em>한 번에 부러진다</em>. 네가 "괜찮다"를 반복할 때가 가장 위험한 때다.`],
  use:[`이 팔자를 쓰는 법은 하나다. <b>기둥이 되되, 숲을 만들 것.</b> 혼자 서 있는 나무는 바람을 다 맞지만, 숲의 나무는 바람을 나눠 맞는다.`,
  `${bigY}년 전후로 네 곁에 숲이 될 사람들이 들어온다. 그때 혼자 다 지려 하지 마라. 그게 이 원국의 갈림길이다.`]},
 {t:'굽은 덩굴의 팔자', body:[
  `${nm}. 네 뿌리는 <em>을목(乙木)</em>— 바위를 타고 오르는 덩굴이다. 정면으로 부딪히지 않고, 감고 돌아서 기어이 꼭대기에 닿는 팔자.`,
  `사람들은 너를 부드럽다고 하지만, 그건 반만 본 것이다. 덩굴은 부드러운 게 아니라 <b>끊어지지 않는 것</b>이다. 네 유연함은 사실 가장 질긴 종류의 고집이다.`,
  `너는 지는 것 같다가도 결국 이겨 있는 사람이다. 다만 그 과정이 늘 오래 걸렸을 뿐.`],
  shadow:[`덩굴의 그늘은 <em>기댈 곳</em>이다. 을목은 타고 오를 담이 있어야 산다. 그래서 너는 사람에게, 조직에, 관계에 기대는 자신을 못나다 여겨 왔다.`,
  `허나 그건 결함이 아니라 구조다. 문제는 기대는 것이 아니라, <b>썩은 담을 붙잡고 있는 것</b>이다. 네가 놓지 못했던 그 자리— 담이 아니라 늪이었다.`],
  use:[`이 팔자를 쓰는 법— <b>담을 고르는 눈</b>을 기르는 것이다. 오를 가치가 있는 벽인지, 무너질 벽인지.`,
  `${midY}년, 네 앞에 새 담이 나타난다. 이번에는 높이가 아니라 <em>뿌리의 깊이</em>를 보고 골라라.`]},
 {t:'한낮 해의 팔자', body:[
  `${nm}. 네 뿌리는 <em>병화(丙火)</em>— 하늘 한가운데 뜬 해다. 숨기려 해도 숨겨지지 않고, 어디서든 눈에 띄는 팔자.`,
  `너는 사람들 앞에서 밝다. 그런데 그 밝음은 성격이 아니라 <b>천성의 위치</b>다. 해는 뜨고 싶어서 뜨는 게 아니다. 그냥 그 자리가 하늘인 것이다.`,
  `그래서 너의 지침은 남들과 다르다. 남들은 쉬면 회복되지만, 너는 <em>보는 눈이 없어야</em> 회복된다.`],
  shadow:[`해의 그늘은 정오에 없다— 그래서 병화는 제 그림자를 못 본다. 네가 무심코 한 말과 행동이 남에게 얼마나 뜨거웠는지, 너는 종종 모른다.`,
  `또 하나. 해는 <b>구름을 이기지 못한다.</b> 실력이 아니라 시류(時流)에 가려질 때가 있다. ${pastY}년의 억울함— 그건 네 빛의 문제가 아니라 구름의 문제였다.`],
  use:[`이 팔자를 쓰는 법— <b>비추는 대상을 고르는 것.</b> 해는 모든 곳을 비추려다 아무것도 못 데운다.`,
  `${bigY}년 무렵, 네 빛을 알아보는 자리가 온다. 그때는 넓게 비추지 말고, <em>한 곳을 오래</em> 비춰라.`]},
 {t:'등잔불의 팔자', body:[

/* ═══════════ 페이지 빌드 ═══════════ */
const pages = [];
const tocEntries = [];
function addPage(html, cls){ pages.push({html, cls: cls || ''}); }
function addToc(label, title){ tocEntries.push({label, title, page: pages.length + 1}); }
function pgHead(no){ return `<p class="pg-no">— 第 ${no} 章 —</p>`; }

/* 1. 표지 */

  </div>`, 'cover');

/* 2. 서문 */

  <p class="pg-body">아흔아홉 장. 짧지 않다. 허나 ${age}해를 살아온 팔자를 적는데, 이보다 짧으면 그건 성의가 아니라 요약이다.</p>
  <p class="pg-body">나는 좋은 말만 골라 적지 않았다. 네 원국에 있는 것은 있는 대로, 없는 것은 없는 대로 적었다. <em>듣기 좋은 거짓보다, 쓰기 아픈 진실이 남는 법</em>이니.</p>
  <p class="pg-body">천천히 읽어라. 하루에 다 읽을 책이 아니다. 막히는 장이 있거든— 그 장이 지금 네게 필요한 장이다.</p>
  <p class="pg-note">深谷寺 여든세 번째 무녀, 묘담 씀</p>`);

/* 3. 읽는 법 */
addPage(`${pgHead(3)}

  <p class="pg-body"><b>둘.</b> 살(殺)은 저주가 아니다. 감당 못 하면 재앙이고, 감당해 내면 무기다. 이 책의 절반은 그 다스리는 법에 쓰였다.</p>
  <p class="pg-body"><b>셋.</b> 연도와 시기는 흐름의 물목이다. 그날이 오면 일이 터진다는 뜻이 아니라, <em>그 무렵 물살이 바뀐다</em>는 뜻이다. 미리 알고 서 있는 자와 모르고 휩쓸리는 자— 그 차이를 위해 적는 것이다.</p>`);

/* ═══ PART 렌더 헬퍼 ═══ */
let partNo = 0;
const PART_HANJA = ['壹','貳','參','肆','伍','陸','柒','捌','玖','拾'];
function addPartDivider(title, sub){
  const hj = PART_HANJA[partNo]; partNo++;
  addToc(hj, title);
  addPage(`
    <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
      <div class="dv-hanja">${hj}</div>
      <div class="dv-t">${title}</div>
      <div class="dv-s">${sub}</div>
      <div class="dv-line"></div>
    </div>`, 'divider');
}
function contentPage(label, title, bodies, extra){
  addPage(`${pgHead(pages.length + 1)}
    <p class="pg-label">${label}</p>
    <h2 class="pg-title">${title}</h2>
    <div class="hr"></div>
    ${bodies.map(b=>`<p class="pg-body">${b}</p>`).join('')}
    ${extra || ''}`);
}

/* ═══ PART 1 — 뿌리 (년간 변형) ═══ */

addPartDivider('뿌리 — 타고난 판', `${STEM_SIDE[yStemIdx]} · ${p1v.t}`);

contentPage('壹 · 뿌리', '이 뿌리의 그늘', p1v.shadow);
contentPage('壹 · 뿌리', '이 뿌리를 쓰는 법', p1v.use);

sals.forEach((s, i) => {

/* ═══ 99장 맞추기 — 간지 페이지 삽입/트림 ═══ */
(function fitTo99(){
  const FILLERS = [
    ['殺','살을 아는 자는, 살에 잡히지 않는다.'],
    ['命','팔자는 대본이 아니라 지형이다.'],
    ['流','흐름을 아는 자의 선택은 다르다.'],
    ['緣','귀한 인연은 소리 없이 온다.'],
    ['財','돈은 그릇만큼 고인다.'],
    ['心','마음이 어지러운 날에는 결정하지 않는다.'],
    ['山','엎드림은 도약 전의 자세다.'],
    ['道','돌아가는 길이 빠른 길이다.']
  ];
  let fi = 0;
  while (pages.length < 99){
    const [hj, tx] = FILLERS[fi % FILLERS.length]; fi++;
    // 뒤에서 두 번째(인장 앞)에 삽입
    pages.splice(pages.length - 1, 0, {cls:'divider', html:`
      <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
        <div class="dv-hanja" style="opacity:.75">${hj}</div>
        <div class="dv-s" style="margin-top:20px;font-size:14px">${tx}</div>
      </div>`});
  }
  while (pages.length > 99){ pages.splice(pages.length - 2, 1); }
})();

/* ═══ 렌더 ═══ */
const pager = document.getElementById('pager');
pager.innerHTML = `<div id="track">${pages.map((p, i) => `<div class="page ${p.cls}" data-i="${i}">${p.html}</div>`).join('')}</div>`;
const track = document.getElementById('track');

const total = pages.length;
let cur = 0;
function currentPage(){ return cur; }
function updateBar(){
  document.getElementById('pageNo').textContent = `第 ${cur + 1} 章 / ${total}`;
  document.getElementById('progressBar').style.width = ((cur + 1) / total * 100) + '%';
}
function goPage(i){
  cur = Math.max(0, Math.min(total - 1, i));
  track.style.transition = '';
  track.style.transform = `translateX(${-cur * 100}%)`;
  // 새 장은 맨 위에서 시작
  const pg = track.children[cur];
  if (pg) pg.scrollTop = 0;
  updateBar();
}
updateBar();

/* 스와이프 — 손가락을 따라오되, 놓으면 무조건 ±1장만 */
(function(){
  let startX = 0, startY = 0, mode = null, dx = 0;
  const W = () => pager.clientWidth;
  pager.addEventListener('pointerdown', e => {
    startX = e.clientX; startY = e.clientY; mode = null; dx = 0;
  }, {passive:true});
  pager.addEventListener('pointermove', e => {
    if (e.pressure === 0 && e.pointerType === 'mouse') return; // 마우스는 드래그 중일 때만
    const mx = e.clientX - startX, my = e.clientY - startY;
    if (mode === null){
      if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my) * 1.2) mode = 'h';
      else if (Math.abs(my) > 10) mode = 'v';
    }
    if (mode === 'h'){
      dx = mx;
      // 가장자리 저항
      if ((cur === 0 && dx > 0) || (cur === total - 1 && dx < 0)) dx = dx * .3;
      track.style.transition = 'none';
      track.style.transform = `translateX(calc(${-cur * 100}% + ${dx}px))`;
    }
  }, {passive:true});
  const finish = () => {
    if (mode !== 'h'){ mode = null; return; }
    const TH = Math.min(70, W() * .18);
    if (dx < -TH) goPage(cur + 1);
    else if (dx > TH) goPage(cur - 1);
    else goPage(cur);
    mode = null; dx = 0;
  };
  pager.addEventListener('pointerup', finish, {passive:true});
  pager.addEventListener('pointercancel', finish, {passive:true});
})();

document.getElementById('tapPrev').addEventListener('click', () => goPage(cur - 1));
document.getElementById('tapNext').addEventListener('click', () => goPage(cur + 1));

/* 목차 오버레이 */
const tocList = document.getElementById('tocList');
tocList.innerHTML = tocEntries.map(t =>
  `<div class="toc-item" onclick="jumpTo(${t.page - 1})"><span class="n">${t.label}</span><span class="x">${t.title}</span><span class="p">${t.page}장</span></div>`
).join('');
function openToc(){ document.getElementById('tocOverlay').classList.add('on'); }
function closeToc(){ document.getElementById('tocOverlay').classList.remove('on'); }
function jumpTo(i){ closeToc(); goPage(i); }

/* 공유 — 캐릭터 랜딩(myodam)으로 초대 */
async function shareSite(){
  const data = {
    title: '심곡사(深谷寺)',
    text: '숲 속 깊은 산사의 여든세 번째 무녀가, 네 사주에 박힌 살(殺)을 짚는다.',
    url: 'https://simgoksa.com/myodam/'
  };
  const done = document.getElementById('shareDone');
  try{
    if (navigator.share){ await navigator.share(data); if (done) done.style.display = 'block'; }
    else { await navigator.clipboard.writeText(data.url); if (done){ done.textContent = '주소가 복사되었다 — 카카오톡에 붙여넣어라.'; done.style.display = 'block'; } }
  }catch(e){}
}

/* 키보드 (PC) */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goPage(Math.min(total - 1, currentPage() + 1));
  if (e.key === 'ArrowLeft') goPage(Math.max(0, currentPage() - 1));
});

/* 첫 방문 스와이프 힌트 */
(function(){
  const hint = document.createElement('div');
  hint.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);z-index:60;background:rgba(5,4,4,.78);backdrop-filter:blur(6px);border:1px solid rgba(232,224,216,.2);border-radius:999px;padding:10px 20px;font-size:12.5px;letter-spacing:.15em;color:#e8e0d8;transition:opacity 1s ease;pointer-events:none';
  hint.textContent = '옆으로 넘겨 읽어라 →';
  document.body.appendChild(hint);
  let dismissed = false;
  const dismiss = () => { if (dismissed) return; dismissed = true; hint.style.opacity = '0'; setTimeout(()=>hint.remove(), 1100); };
  pager.addEventListener('pointerdown', dismiss, {once:true, passive:true});
  document.getElementById('tapNext').addEventListener('click', dismiss, {once:true});
  setTimeout(dismiss, 6000);
})();
</script>
