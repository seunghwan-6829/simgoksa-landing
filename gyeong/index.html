<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재물의 경(經) — 深谷寺 장경각</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0705">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0705; --paper:#e8ddc7; --ink:#e2d7c2; --ink-dim:#9a8a6c; --dim2:#6b5c44;
  --brass:#c9a25c; --brass-hi:#e0a43c; --loo:#d24a3e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:#050403;color:var(--ink);
  font-family:'Noto Serif KR','Nanum Myeongjo',serif;
  overflow-x:hidden;
}
#doc{
  position:relative;max-width:480px;margin:0 auto;background:var(--bg);
  min-height:100dvh;box-shadow:0 0 80px rgba(0,0,0,.9);
  padding-bottom:80px;
}
.grain{
  pointer-events:none;position:fixed;inset:-100%;width:300%;height:300%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  opacity:.06;z-index:90;
}
/* 상단바 */
#topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:rgba(10,7,5,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(201,162,92,.22);
}
#topbar a,#topbar button{
  appearance:none;background:none;border:none;cursor:pointer;
  font-family:inherit;color:var(--ink-dim);font-size:12.5px;letter-spacing:.12em;text-decoration:none;
}
#topbar a:hover,#topbar button:hover{color:var(--paper)}
#topbar .t{flex:1;text-align:center;font-family:'Nanum Myeongjo',serif;font-weight:800;color:var(--paper);font-size:14px;letter-spacing:.2em}
/* 표지 머리 */
#head{
  position:relative;overflow:hidden;
  background:url('../assets/hw_cover.jpg') center/cover no-repeat;
  min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:60px 26px;
}
#head::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 45%,transparent 30%,rgba(5,4,3,.72) 100%)}
#head > *{position:relative;z-index:2}
#head .h-kicker{font-size:11px;letter-spacing:.4em;color:var(--brass);margin-bottom:16px;text-shadow:0 1px 4px #000}
#head h1{
  font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:44px;letter-spacing:.18em;
  color:#efe4cd;text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 40px rgba(224,164,60,.25);
}
#head .owner{
  margin-top:18px;display:inline-block;
  background:linear-gradient(175deg,#e4d7bc,#cdbb95);color:#241708;
  font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:14px;letter-spacing:.12em;
  padding:8px 16px;border-radius:2px;box-shadow:0 4px 14px rgba(0,0,0,.6);transform:rotate(-.8deg);
}
#head .reg{margin-top:14px;font-size:11px;letter-spacing:.2em;color:#cbbb99;text-shadow:0 1px 4px #000}
#head .no{margin-top:6px;font-size:10px;letter-spacing:.24em;color:#8a7a60;text-shadow:0 1px 4px #000}
#head .seal{
  position:absolute;right:26px;bottom:30px;z-index:2;
  width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:26px;
  color:var(--loo);border:3px solid rgba(210,74,62,.8);border-radius:4px;transform:rotate(-8deg);
}
/* 목차 */
#toc{
  margin:34px 22px 10px;padding:20px 20px 14px;
  border:1px solid rgba(201,162,92,.3);border-radius:3px;background:rgba(23,16,8,.5);
}
#toc .tt{font-family:'Nanum Myeongjo',serif;font-weight:800;color:var(--paper);font-size:14px;letter-spacing:.24em;margin-bottom:12px}
#toc a{
  display:flex;gap:10px;align-items:baseline;padding:7px 0;text-decoration:none;
  border-bottom:1px dashed rgba(232,224,216,.1);font-size:13px;color:var(--ink-dim);
}
#toc a:last-child{border-bottom:none}
#toc a b{color:var(--brass);font-family:'Nanum Myeongjo',serif;font-weight:800;min-width:22px}
#toc a:hover{color:var(--paper)}
/* 권(卷) */
.kwon{position:relative;padding:64px 26px 10px 26px;max-width:100%}
.kwon .vtag{
  position:absolute;top:70px;right:14px;writing-mode:vertical-rl;
  font-family:'Nanum Myeongjo',serif;font-size:11.5px;letter-spacing:.4em;
  color:rgba(201,162,92,.5);border-left:1px solid rgba(201,162,92,.25);padding-left:8px;user-select:none;
}
.kwon .k-no{font-size:11px;letter-spacing:.34em;color:var(--brass);margin-bottom:10px}
.kwon h2{
  font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:24px;line-height:1.55;
  color:var(--paper);word-break:keep-all;padding-right:36px;
}
.kwon h2 .r{color:var(--brass-hi)}
.k-rule{width:56px;height:2px;background:linear-gradient(90deg,var(--brass),transparent);margin:18px 0 22px}
.kwon p{font-size:15px;line-height:2.05;color:var(--ink);word-break:keep-all;margin-bottom:16px;padding-right:30px}
.kwon p em{font-style:normal;color:var(--brass-hi)}
.kwon p.dim{color:var(--ink-dim);font-size:13.5px}
.k-voice{
  border-left:3px double rgba(201,162,92,.5);padding:4px 26px 4px 16px;margin:22px 0;
  font-family:'Nanum Myeongjo',serif;font-size:15.5px;line-height:2.05;color:var(--paper);word-break:keep-all;
}
.k-voice em{font-style:normal;color:var(--brass-hi)}
/* 장부 행 */
.rows{margin:20px 0;border-top:1px solid rgba(201,162,92,.3)}
.row{
  display:flex;gap:12px;align-items:baseline;
  padding:13px 2px;border-bottom:1px dashed rgba(232,224,216,.12);font-size:14px;
}
.row .k{flex-shrink:0;width:88px;color:#8a7a60;font-size:12.5px;letter-spacing:.08em}
.row .v{flex:1;font-family:'Nanum Myeongjo',serif;color:var(--ink);letter-spacing:.04em}
.row .v b{color:var(--paper);font-weight:800}
.row .v em{font-style:normal;color:var(--brass-hi)}
.row .m{flex-shrink:0;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:13px}
.row .m.good{color:var(--brass)}
.row .m.bad{color:var(--loo)}
/* 구멍 항목 */
.hole{
  margin:26px 0;border-left:3px double rgba(210,74,62,.55);padding:2px 26px 4px 16px;
}
.hole .hh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hole .hz{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:26px;color:var(--loo)}
.hole .hn{font-weight:700;font-size:16px;color:var(--paper)}
.hole .hn small{display:block;font-weight:300;font-size:11px;color:var(--ink-dim);letter-spacing:.14em;margin-top:2px}
.hole .lv{margin-left:auto;font-size:11px;letter-spacing:.1em;color:#d8968c;border:1.5px solid rgba(210,74,62,.6);border-radius:3px;padding:3px 8px;transform:rotate(-3deg)}
.fix{
  margin:14px 0 6px;padding:14px 16px;border:1px dashed rgba(201,162,92,.4);
  border-radius:3px;background:rgba(23,16,8,.5);
}
.fix .ft{font-size:11.5px;letter-spacing:.26em;color:var(--brass);margin-bottom:8px}
.fix ol{list-style:none}
.fix li{display:flex;gap:9px;font-size:13.8px;line-height:1.95;color:var(--ink);word-break:keep-all;padding:3px 0}
.fix li::before{content:"규(規)";flex-shrink:0;font-size:10.5px;color:var(--dim2);letter-spacing:.08em;padding-top:4px}
/* 달력/십년 */
.cal .row .k{width:56px}
.hr-k{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(201,162,92,.4),transparent);margin:46px 0 0}
/* 맺음 */
#tail{padding:70px 26px 30px;text-align:center}
#tail .z{font-family:'Nanum Myeongjo',serif;font-size:26px;font-weight:800;color:var(--paper);letter-spacing:.3em;margin-bottom:22px}
#tail p{font-size:14.5px;line-height:2.1;color:var(--ink-dim);word-break:keep-all}
#tail .sign{margin-top:26px;display:inline-flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.18em;color:var(--ink-dim)}
#tail .sign b{color:var(--paper)}
#tail .stamp{
  width:27px;height:42px;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;text-orientation:upright;
  font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:14px;line-height:1;letter-spacing:3px;
  padding-top:3px;
  color:var(--loo);border:2px solid rgba(210,74,62,.75);border-radius:3px;transform:rotate(6deg);
}
#tail .home{
  display:inline-block;margin-top:36px;color:var(--brass);text-decoration:none;
  font-size:13px;letter-spacing:.18em;border:1px solid rgba(201,162,92,.4);
  padding:13px 26px;border-radius:2px;
}
.demo-bar{
  position:sticky;top:0;z-index:60;text-align:center;
  background:#3a2c10;color:#e8d5a7;font-size:11.5px;letter-spacing:.14em;padding:8px;
}
@media print{
  .grain,#topbar,.demo-bar,#tail .home{display:none!important}
  body,#doc{background:#fff;color:#222;box-shadow:none}
  #head{min-height:300px}
  .kwon p,.row .v{color:#333}
}
@media (min-width:768px){
  body::before{content:"";position:fixed;inset:-40px;z-index:-1;background:url('../assets/hw_aisle.jpg') center/cover no-repeat;filter:blur(46px) brightness(.22)}
  #doc{border-left:1px solid rgba(232,224,216,.08);border-right:1px solid rgba(232,224,216,.08)}
}
</style>
</head>
<body>
<div class="grain"></div>
<div class="demo-bar" id="demoBar" style="display:none">미리보기 열람 — 실제 구매 시 본인의 원국으로 셈해집니다</div>

<div id="doc">
  <div id="topbar">
    <a href="../">⌂ 深谷寺</a>
    <span class="t">財物經</span>
    <button onclick="saveReport()">[갈무리]</button>
    <a href="#toc">目次</a>
  </div>

  <header id="head">
    <p class="h-kicker">深谷寺 藏經閣 · 檢證 筆寫本</p>
    <h1>재물의 경</h1>
    <div class="owner" id="ownerTag">그대의 재물 장부</div>
    <p class="reg" id="regLine">— 년 — 월 — 일생</p>
    <p class="no" id="bookNo">제 —호 · 현월 셈하여 적다</p>
    <div class="seal">漏</div>
  </header>

  <nav id="toc"></nav>
  <main id="kwons"></main>

  <footer id="tail">
    <div class="z">終</div>
    <p id="tailWords">여기까지가, 네 장부다.</p>
    <div class="sign">셈하고 적다 — 장경각 <b>현월</b><span class="stamp">玄月</span></div>
    <br>
    <a class="home" href="../">深谷寺 메인으로 돌아가기 →</a>
  </footer>
</div>

<script>
/* ═══ 입력 (하이언월 랜딩과 동일 규약) ═══ */
const qs = new URLSearchParams(location.search);
let user = null;
if (qs.get('name') || qs.get('demo')){
  user = { name: (qs.get('name') || '김심곡').trim(), birth: {y:+(qs.get('y')||1995), m:+(qs.get('m')||3), d:+(qs.get('d')||14)}, gender: (qs.get('g') || '여').trim() };
  if (qs.get('demo')) document.getElementById('demoBar').style.display = 'block';
} else {
  try{
    const raw = localStorage.getItem('sgs_hyunwol');
    if (raw){ const d = JSON.parse(raw); if (d && d.name && d.birth) user = d; }
  }catch(e){}
  if (!user){ location.replace('../hyunwol/'); }
}
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

/* ═══ 해시 — 랜딩(hyunwol)과 완전 동일: 같은 사람 = 같은 경(經) ═══ */
function hashUser(){
  const s = user.name + user.birth.y + user.birth.m + user.birth.d + user.gender;
  let h = 0; for (let i = 0; i < s.length; i++){ h = ((h<<5)-h+s.charCodeAt(i))|0; }
  return Math.abs(h);
}
const H = hashUser();
const y = user.birth.y, nowY = new Date().getFullYear(), age = nowY - y + 1;
const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const sIdx = (y-4)%10, bIdx = (y-4)%12;
const yearPillar = STEMS[sIdx] + BRANCHES[bIdx];

/* 구멍 선택 — 랜딩과 동일 로직 (진단 일치 보장) */
const SAL_POOL = [
  {h:'奪', name:'비겁탈재', hanja:'比劫奪財', lv:'심각',
   root:'네 원국은 비견(比肩)과 겁재(劫財)가 재성(財星)의 곁에 바짝 붙어 앉은 자리다. 같은 기운끼리 한 그릇의 밥을 나누는 격이니, 돈이 생기는 족족 곁의 손이 먼저 닿는다.',
   shape:'동업에서 내 몫이 얇아지고, 보증과 빌려준 돈이 돌아오지 않고, 가까운 이의 급한 사정이 꼭 네 지갑 앞에서 터진다. 인정이 많은 것이 죄가 아니라— 새는 자리를 모르는 것이 죄다.',
   fixes:['돈이 오가는 일은 아무리 가까워도 문서를 세워라. 정(情)은 정이고 셈은 셈이다.','동업은 지분을 나누지 말고 역할을 갈라라. 돈줄은 한 손에 쥐어야 샐 틈이 없다.','거절을 배워라. 네 장부의 첫 규(規)는— 못 돌려받을 돈은 처음부터 주지 않는 것이다.']},
  {h:'弱', name:'재다신약', hanja:'財多身弱', lv:'심각',
   root:'재성은 왕(旺)한데 일간(日干)이 그를 감당하지 못하는 자리다. 그릇보다 물이 많으니, 큰물이 들어올수록 그릇이 먼저 상한다.',
   shape:'목돈이 생기면 꼭 탈이 나고, 벌이가 커질수록 몸과 마음이 먼저 지치고, 돈이 나를 부리는 형국이 된다. 재물복이 없는 게 아니라— 아직 그릇이 덜 여문 것이다.',
   fixes:['큰돈은 한 그릇에 담지 말고 쪼개 묶어라. 작은 그릇 여럿이 큰 그릇 하나를 이긴다.','버는 공부보다 지키는 공부를 먼저 하라. 그릇이 여문 뒤에는 같은 물도 넘치지 않는다.','몸이 상하면 재물이 먼저 샌다. 잠과 끼니를 지키는 것이 곧 재테크다.']},
  {h:'洩', name:'식상설기', hanja:'食傷洩氣', lv:'위험',
   root:'식신(食神)과 상관(傷官)이 일간의 기운을 밖으로 쏟아내는 자리다. 재주가 많고 쓰는 손이 커서, 들어오는 길보다 나가는 길이 넓다.',
   shape:'월급날과 카드값 날이 맞물려 돌고, 기분이 곧 지출이 되고, 벌이가 늘어도 잔고는 그대로다. 씀씀이는 네 탓만이 아니다— 판이 그렇게 생겼으니, 판을 고쳐야 한다.',
   fixes:['고정 지출부터 봉(封)하라. 나가는 구멍의 수를 줄이는 것이 버는 것보다 빠르다.','들어온 돈의 일 할은 보기 전에 떼어 감춰라. 눈에 보이는 돈은 이미 쓴 돈이다.','단, 배움과 연장에 쓰는 돈은 아끼지 마라. 설기(洩氣)는 재주로 돌리면 돈길이 된다.']},
  {h:'空', name:'재고공망', hanja:'財庫空亡', lv:'위험',
   root:'재물이 머물러야 할 창고(庫) 자리가 공망(空亡)으로 비어 있는 격이다. 물은 흐르는데 담아 둘 독이 없으니, 모아도 쌓이지 않고 쌓여도 오래가지 못한다.',
   shape:'통장을 스치는 돈, 이유 없이 깨지는 적금, 목돈이 모일 만하면 생기는 지출 사고. 창고가 빈 팔자는 창고를 새로 지으면 된다— 자리는 이미 봐 두었다.',
   fixes:['이름 붙은 창고를 세워라. 쓰임을 정하지 않은 돈은 반드시 샌다.','창고는 손이 닿기 어려울수록 좋다. 해지 어려운 곳에 묶는 것이 빈 창고를 채우는 법이다.','창고가 차기 시작하는 때가 온다. 그때까지는 크게 벌리기보다 새는 곳을 막아라.']},
  {h:'驛', name:'역마재', hanja:'驛馬財', lv:'주의',
   root:'재성이 역마(驛馬) 위에 앉은 자리다. 돈이 길 위에 떠 있으니, 앉은 자리에서 버는 재물은 얇고 움직이는 곳에 돈이 붙는다.',
   shape:'한 자리 벌이가 답답하고, 옮기면 풀리고 머물면 막힌다. 떠돎이 팔자가 아니라— 길이 곧 네 돈줄이라는 뜻이다.',
   fixes:['벌이의 반경을 넓혀라. 출장·타지·바깥 거래에 재물의 물꼬가 있다.','움직임에도 방향이 있다. 네 물꼬가 트인 방(方)을 따라 움직여라.','다만 거처는 자주 옮기지 마라. 돈은 길에서 벌고, 창고는 한자리에 두는 것이다.']},
  {h:'劫', name:'겁재노출', hanja:'劫財露出', lv:'주의',
   root:'겁재(劫財)가 천간에 드러난 자리다. 드러난 재물은 뺏기는 법— 벌이가 알려질수록 새는 속도가 빨라진다.',
   shape:'수입이 알려지면 꼭 손 벌리는 이가 나타나고, 자랑한 투자는 꼭 물리고, 보여준 지갑은 꼭 얇아진다. 네 재산의 반은— 감추는 법을 모르는 값으로 새었다.',
