    <span style="display:flex;gap:8px">

    </span>

  <a href="/">메인으로 →</a>
</div>

<script>
/* ═══ 입력 (hongdan 랜딩과 동일 규약) ═══ */
const qs = new URLSearchParams(location.search);
if (window.SGS_HALT) throw new Error('sgs:halt');   // 접근 확인 중 — /assets/sgs-access.js 가 다시 연다
let user = null;
const ACC = window.SGS_ACCESS;   // 서버가 확인한 주문
if (ACC){
  user = { name: ACC.name, birth: {y:ACC.y, m:ACC.m, d:ACC.d}, gender: ACC.g };
} else if (qs.get('name') || qs.get('demo')){
  user = { name:(qs.get('name')||'김심곡').trim().slice(0, 40), birth:{y:+(qs.get('y')||1995), m:+(qs.get('m')||3), d:+(qs.get('d')||14)}, gender:(qs.get('g')||'여').trim() };
  if (user.gender !== '남' && user.gender !== '여') user.gender = '여';
  if (qs.get('demo')) document.getElementById('demoBar').style.display = 'block';
}
if (!user){ location.replace('../library/'); throw new Error('sgs:nouser'); }

/* 갈림길 — 재회(jae) / 연애(yeon). 주문에 적힌 값이 우선, 없으면 주소, 그래도 없으면 연애 */
const PATH = ((ACC && ACC.path) || qs.get('path')) === 'jae' ? 'jae' : 'yeon';
const JAE = PATH === 'jae';

/* ═══ 부분 구매(찢어가기) · 미리 열람 — 묘담·현월 결과지와 같은 규약 ═══ */
const PICKS = [...new Set(String(ACC ? (ACC.picks || '') : (qs.get('picks') || '')).split(/[^0-9]+/).map(Number).filter(n => n >= 1 && n <= 10))].sort((a,b)=>a-b);
const PARTIAL = PICKS.length > 0 && PICKS.length < 10;
const PREVIEW = !!qs.get('preview');
if (PREVIEW) document.body.classList.add('preview');
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const nm = esc(user.name);

/* ═══ 해시 — 랜딩과 완전 동일 (같은 사람 = 같은 연서) ═══ */
const HASH_V = ACC ? ACC.hv : ((qs.get('hv') === '1') ? 1 : 2);
function hashUser(){ return SGS.hashUser(user, HASH_V); }
const H = hashUser();
const y = user.birth.y, nowY = (ACC && ACC.yr) ? ACC.yr : new Date().getFullYear(), age = nowY - y + 1;
const STEMS = SGS.STEMS, BRANCHES = SGS.BRANCHES;
const sIdx = (y-4)%10, bIdx = (y-4)%12;
const yearPillar = STEMS[sIdx] + BRANCHES[bIdx];

/* 인연살 — 랜딩(hongdan)과 순서·개수 동일한 풀 + 동일 선택 로직 */
const SAL_POOL = [
  {h:'桃',name:'도화살',hanja:'桃花殺',lv:'양면',
   root:'일지(日支) 곁에 도화(桃花)가 앉은 자리예요. 꽃이 핀 가지엔 벌이 꼬이는 법— 사람이 끊이지 않는 대신, 가벼운 마음까지 함께 날아들어요.',
   shape:'다가오는 사람은 많은데 남는 사람이 없고, 호감은 쉽게 사는데 진심은 늦게 오고, 곁이 늘 조금 시끄럽죠. 꽃이 죄가 아니에요— 벌과 나비를 가리는 법을 몰랐을 뿐.',
   fixes:['먼저 뜨거워지는 쪽이 지는 판이에요. 도화가 짙은 그대는 반 박자 늦게 답해요— 그 반 박자가 가벼운 마음을 걸러 줘요.','호감을 자주 확인받으려 하지 말아요. 도화의 빛은 아껴 쓸수록 짙어져요.','꽃을 꺾으려는 손과 물을 주는 손을 가려요— 만난 지 석 달 안에 셈부터 꺼내는 이는 꺾으려는 손이에요.']},
  {h:'紅',name:'홍염살',hanja:'紅艶殺',lv:'짙음',
   root:'홍염(紅艶)이 드러난 자리예요. 눈빛 한 번, 웃음 한 번에 사람을 붙드는 힘— 타고난 매혹이지만, 아닌 사람까지 붙들어요.',
   shape:'마음 준 적 없는 이가 혼자 깊어지고, 오해가 잦고, 정작 그대가 원하는 사람 앞에선 그 빛이 엉뚱하게 새죠. 매혹은 칼과 같아서— 쥐는 법을 알아야 그대 것이 돼요.',

      <li>그 사람의 ${FTALK.replace('말버릇','말')}이 잦아지거든— 그때가 그대가 한 걸음 다가설 때예요.</li>
    </ol></div>`);
  addPage(`${pgHead('結八 · 곁말')}
    <h2 class="pg-title">곁말 하나</h2>
    <div class="hr"></div>
    <p class="pg-body">붙잡는 법의 절반은 그대를 지키는 법이에요. 연이 왔다고 그대 걸음을 다 바꾸면— <em>그 사람이 반한 그대가 사라져요.</em></p>
    <div class="pg-quote">"실은 두 사람이 마주 당겨야 매듭이 돼요.<br>혼자 당기는 실은— <em>언젠가 손을 베요.</em>"</div>`);
}

/* 今年 · 올해 할 일 셋 · 삼갈 일 셋 — 찢어 두고 보는 한 장 */
const DO_J = ['물때 아닌 달의 그리움은 이 연서를 다시 펴는 걸로 달래요.','그 사람 곁 소식을 캐지 말아요— 실은 조용할 때 아물어요.','그대를 가꾸는 일 하나를 정해 물때까지 이어가요. 재회의 첫인상은 "달라진 그대"예요.'];
const DONT_J = [`해마다 ${mBad}월의 연락— 그 달만은 참아요.`,'술기운에 보내는 연락은 안 돼요. 물때가 다 무너져요.','곁에 이 실 얘기를 널리 하지 말아요— 말이 많아지면 실이 흔들려요.'];
const DO_Y = [`${meetM}월 언저리의 새 자리, 새 소개는 물리치지 말아요.`,`${dirMain}쪽에서 오는 걸음을 무겁게 여겨요.`,'그대 등불을 밝혀요— 사람들 앞에 그대가 보여야 실이 찾아와요.'];
const DONT_Y = ['외로움이 짙은 밤의 답장은 아침에 해요— 밤의 실은 헐거워요.','아닌 줄 아는 실을 심심풀이로 쥐지 말아요. 새 실이 감길 자리를 막아요.','세 낌새(結七)가 겹치는 이에게 두 번째 자리를 주지 말아요.'];
addPage(`${pgHead('今年 · 올해')}
  <h2 class="pg-title">올해 할 일 셋,<br><span class="r">삼갈 일 셋</span></h2>
  <div class="hr"></div>
  <div class="fix"><div class="ft">할 일 · 行</div><ul>${(JAE?DO_J:DO_Y).map(t => `<li>${t}</li>`).join('')}</ul></div>
  <div class="fix" style="border-color:rgba(210,74,62,.45)"><div class="ft" style="color:var(--loo)">삼갈 일 · 戒</div><ul>${(JAE?DONT_J:DONT_Y).map(t => `<li>${t}</li>`).join('')}</ul></div>
  <p class="pg-note">이 한 장은 찢어 두고 봐요. 여섯 줄이 한 해의 실을 지켜요.</p>`);

/* ═══ 結九 — 열두 달, 한 달 한 장 ═══ */
addToc('結九','열두 달 — 연분 달력');
addPage(`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
  <div class="dv-hanja">曆</div><div class="dv-t">結九 · 열두 달</div>
  <div class="dv-s">다가올 한 해를<br>한 달에 한 장씩 적어요.<br><br>해가 바뀌면 이 매듭을 다시 펴요.</div><div class="dv-line"></div></div>`, 'divider');
for (let m = 1; m <= 12; m++){
  const isG = m === (JAE ? mGood : meetM), isL = m === mBad;
  const t = isG ? (JAE ? '실이 순해지는 달— 물때예요. 가장 가벼운 한 줄이 가장 깊이 닿아요.' : '실이 당겨지는 달— 새 얼굴, 새 자리를 허투루 보내지 말아요.')
        : isL ? (JAE ? '당기면 끊어지는 달— 그리움이 짙어도 이 달만은 실을 쥐고만 있어요.' : '실이 엉키는 달— 시작도 끝맺음도 이 달은 피해요.')
        : MONTH_T[(H + m*5) % 8];
  const markHj = isG ? '結' : isL ? '忌' : MONTH_HJ[m-1][0];
  addPage(`${pgHead('結九 · 연분 달력')}
    <h2 class="pg-title">${m}월 <span class="r" style="font-size:14px;letter-spacing:.2em">${MONTH_HJ[m-1]}</span></h2>
    <div class="pg-hanja" style="${isL?'color:var(--loo);text-shadow:0 0 34px rgba(210,74,62,.3)':''}">${markHj}</div>
    <p class="pg-sub">${isG?'맺히는 달':isL?'삼가는 달':'여상한 달'}</p>
    <p class="pg-body" style="text-align:center">${t}</p>`);
}

/* ═══ 結十 — 십 년 / 혼인의 판 ═══ */
addToc('結十', JAE ? '십 년의 실 — 두 실이 가는 능선' : '혼인의 자리 — 백년의 판');
addPage(`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
  <div class="dv-hanja">${JAE?'嶺':'百'}</div><div class="dv-t">結十 · ${JAE?'십 년의 실':'혼인의 자리'}</div>
  <div class="dv-s">${JAE?'십 년의 능선을<br>일 년에 한 장씩 그려요.':'십 년의 실을 일 년에 한 장씩—<br>혼인이 놓이는 해까지 그려요.'}</div><div class="dv-line"></div></div>`, 'divider');
for (let i = 0; i < 10; i++){
  const yy = nowY + i;
  let lvl = (H >> (i+2)) % 4;
  if (yy === meetY) lvl = 4;
  if (yy === marY && !JAE) lvl = 4;
  if (yy === pastY) lvl = 0;
  const isMeet = yy === meetY, isMar = yy === marY && !JAE;
  addPage(`${pgHead('結十 · 능선')}
    <h2 class="pg-title">${yy}년${yy===nowY?' <span class="r" style="font-size:14px">(올해)</span>':''}</h2>
    <div class="pg-hanja" style="${lvl===4?'':lvl===0?'color:var(--loo);text-shadow:0 0 34px rgba(210,74,62,.3);':'opacity:.55;'}">${lvl===4?'結':lvl===0?'散':'絲'}</div>
    <p class="pg-sub">${['실이 쉬는 해','고르는 해','잔정이 붇는 해','실이 빨라지는 해','크게 매이는 해'][lvl]}</p>
    <p class="pg-body" style="text-align:center">${isMar ? '혼인의 판이 놓이는 해예요— 백년의 매듭이 이 언저리에 있어요. 이 해를 위해 앞의 모든 매듭이 있었어요.' : isMeet ? (JAE ? '물때의 해— 이 해를 위해 앞의 모든 매듭이 있었어요.' : '실이 당겨지는 해— 이 해를 위해 앞의 모든 매듭이 있었어요.') : TEN_T[lvl]}</p>
    ${isMeet?`<p class="pg-note">${JAE?mGood:meetM}월— 실이 움직이는 달이에요.</p>`:''}`);
}

const END_IDX = pages.length;   // 여기서부터 맺음 (매듭 경계 계산용)
/* 맺음 */
addPage(`${pgHead('終 · 마지막 장')}
  <h2 class="pg-title">${nm},<br><span class="r">마지막으로 이 말</span></h2>
  <div class="hr"></div>
  <p class="pg-body">${JAE
    ? `답은 <em>${VD.v}</em> 물때는 ${meetY}년 ${mGood}월. 그날까지 그대가 할 일은 매달리는 게 아니라— 그대를 예뻐하는 거예요. 다시 만난 날, 그 사람이 처음 보는 얼굴이 "잘 지낸 그대"여야 하니까.`
    : `실이 당겨지는 해는 <em>${meetY}년</em>, 길목은 ${dirMain}쪽. 그날의 그대가 오늘보다 조금 더 그대다우면— 그걸로 충분해요. 알아보는 건 내가 도와줄게요.`}</p>
  <p class="pg-body">이 연서는 그대 서고에 평생 있어요. 마음이 급해지는 밤엔 ${JAE ? '다섯째' : '넷째'} 매듭을 다시 펴요. …그리고 잘되면, 별당에도 살짝 알려 줘요.</p>
  <div class="pg-quote" style="text-align:center">"연은 오는 것이 아니라,<br><em>알아보는 것이에요.</em>"</div>
  <p class="pg-note">그대의 실을 맡은 — 별당 아씨 홍단</p>
  <p style="margin-top:26px;text-align:center"><a href="../" style="color:var(--brass);font-size:13.5px;letter-spacing:.15em;text-decoration:none;border-bottom:1px solid rgba(215,141,151,.4);padding-bottom:3px">深谷寺 메인으로 돌아가기 →</a></p>`);
addPage(`
  <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
    <div class="dv-hanja" style="font-size:54px">深谷寺</div>
    <div class="dv-t" style="margin-top:22px">별당 · 홍단</div>
    <div class="dv-s" style="margin-top:14px">${nm}의 「붉은 실의 기록」<br>${nowY}년, 별당에서 이어 적음<br>일흔일곱 장 · 十結 · 제 ${bookNoS}호</div>
    <div class="stamp-sq">紅緞</div>
  </div>`, 'divider');

/* ═══ 77장 맞추기 — 홍단 어록 간지 삽입/트림 (사람마다 다른 어록이 다른 자리에) ═══ */
function fitTo77(){
  let fi = H % APHORISM.length;
  while (pages.length < 77){
    const [hj, tx] = APHORISM[fi % APHORISM.length]; fi++;
    pages.splice(pages.length - 2, 0, {cls:'divider', html:`
      <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
        <div class="dv-hanja" style="opacity:.8">${hj}</div>
        <div class="dv-s" style="margin-top:20px;font-size:14px">${tx}</div>
        <div class="dv-s" style="margin-top:26px;font-size:10.5px;opacity:.6">— 홍단이 실을 감으며</div>
      </div>`});
  }
  while (pages.length > 77){ pages.splice(pages.length - 3, 1); }
}

/* ═══ 매듭(結) 경계 — tocEntries 의 結一~結十 사이가 한 매듭 ═══ */
const KNOT = ['結一','結二','結三','結四','結五','結六','結七','結八','結九','結十'];
function partRanges(){
  const parts = tocEntries.filter(t => KNOT.includes(t.label));
  return parts.map((t, i) => ({ no: i + 1, hj: t.label, title: t.title, start: t.page - 1, end: (i + 1 < parts.length ? parts[i + 1].page - 1 : END_IDX) }));
}
function lockPage(r, sub, cta){
  return {cls:'divider', html:`
    <div style="min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 26px">
      <div class="dv-hanja" style="opacity:.55;font-size:60px">${r.hj}</div>
      <div class="dv-t" style="opacity:.6;word-break:keep-all">${r.title}</div>
      <div class="lock-seal">封</div>
      <div class="dv-s" style="margin-top:18px;font-size:14px;line-height:1.9;word-break:keep-all">${sub}</div>
      <button class="lock-btn" onclick="unlockMore()">${cta}</button>
    </div>`};
}
function applyPicks(){
  const ranges = partRanges();
  const front = pages.slice(0, ranges[0].start);
  const tail  = pages.slice(END_IDX);
  const out = [...front];
  const newToc = tocEntries.filter(t => !KNOT.includes(t.label));
  ranges.forEach(r => {
    if (PICKS.includes(r.no)){ newToc.push({label:r.hj, title:r.title, page: out.length + 1}); out.push(...pages.slice(r.start, r.end)); }
    else { newToc.push({label:r.hj, title:r.title, page: out.length + 1, locked:true}); out.push(lockPage(r, `풀이는 끝나 있어요— 그대 이름으로 적힌 <b>${r.end - r.start}장</b>이<br>여기 봉해져 있어요.<br>이 매듭에 뭐라고 적혔는지—<br>마저 찢으면 보여요.`, '이 매듭 마저 풀기 →')); }
  });
  out.push(...tail);
  pages.length = 0; pages.push(...out);
  tocEntries.length = 0; tocEntries.push(...newToc);
}
function applyPreview(){
  const ranges = partRanges();
  const out = pages.slice(0, ranges[0].start);
  out.push(...pages.slice(ranges[0].start, Math.min(ranges[0].start + 3, ranges[0].end)));
  if (ranges[1]) out.push(...pages.slice(ranges[1].start, Math.min(ranges[1].start + 2, ranges[1].end)));
  // 맛보기 — 제일 궁금한 "언제"를 연도만 열어 보인다 (달·방향·얼굴은 본편에)
  out.push({cls:'divider', html:`
    <div style="min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 26px">
      <div class="dv-hanja" style="font-size:60px">時</div>
      <div class="dv-t">${JAE ? '結五 · 물때 — 한 줄만 먼저' : '結四 · 오는 때 — 한 줄만 먼저'}</div>
      <div class="dv-s" style="margin-top:22px;font-size:15px;line-height:2;color:var(--paper);word-break:keep-all">${nm}. ${JAE ? '그대 실을 <em style="font-style:normal;color:var(--brass-hi);font-weight:700">당겨도 되는 물때</em>는—' : '그대 실이 <em style="font-style:normal;color:var(--brass-hi);font-weight:700">당겨지는 해</em>는—'}<br><span style="font-family:'Noto Sans KR',sans-serif;font-size:34px;font-weight:900;color:var(--brass-hi)">${meetY}년</span></div>
      <div class="dv-s" style="margin-top:16px;font-size:13px;line-height:1.9;word-break:keep-all">${JAE ? '몇 월인지, 해마다 <b>당기면 끊어지는 달</b>이 언제인지,<br>첫 연락을 어떻게 적어야 하는지— 결五·結六에 적어 두었어요.' : '어느 철, 어느 방향에서 오는지— 얼굴의 생김까지,<br>結三·結四·結五에 적어 두었어요.'}</div>
    </div>`});
  out.push(lockPage({hj:'封', title:'여기부턴, 찢어가야 읽어요'}, `남은 ${77 - out.length}장— 인연살 ${sals.length}개의 뿌리와 다스리는 법, ${JAE ? '마음의 자국, 이별의 속사정, 물때와 단언' : '올 사람의 얼굴, 오는 때와 길목, 걸러낼 낌새'}, 열두 달과 십 년.<br>급한 매듭만 골라 찢어갈 수도 있어요.`, '찢어가러 가기 →'));
  pages.length = 0; pages.push(...out);
  tocEntries.length = 0;
}
function unlockMore(){
  try{ if (window.parent !== window){ window.parent.postMessage({sgs:'closePreview'}, location.origin); return; } }catch(e){}
  location.href = '../hongdan/#tear';
}
if (PREVIEW) applyPreview();
else if (PARTIAL) applyPicks();
else fitTo77();
/* 장 번호 다시 매기기 — 간지 삽입/봉인으로 순서가 바뀌므로 최종 순서로 */
pages.forEach((p, i) => { p.html = p.html.replace(/戀書 · 第 \d+ 張/, `戀書 · 第 ${i + 1} 張`); });

/* ═══ 렌더 + 페이저 (스와이프당 무조건 1장) ═══ */
const pager = document.getElementById('pager');
pager.innerHTML = `<div id="track">${pages.map((p,i)=>`<div class="page ${p.cls}" data-i="${i}">${p.html}</div>`).join('')}</div>`;
const track = document.getElementById('track');
const total = pages.length;
let cur = 0;
function updateBar(){
  document.getElementById('pageNo').textContent = `第 ${cur+1} 張 / ${total}`;
  document.getElementById('progressBar').style.width = ((cur+1)/total*100) + '%';
  // 마지막 장에 닿으면 메인으로 가는 바가 내려온다
  const hb = document.getElementById('homeBar'); if (hb) hb.classList.toggle('on', cur >= total - 1);
  if (PREVIEW){ try{ window.parent.postMessage({sgs:'page', cur: cur + 1, total}, location.origin); }catch(e){} }
}
function goPage(i){
  cur = Math.max(0, Math.min(total-1, i));
  track.style.transition = '';
  track.style.transform = `translateX(${-cur*100}%)`;
  const pg = track.children[cur]; if (pg) pg.scrollTop = 0;
  updateBar();
}
updateBar();
(function(){
  let startX=0, startY=0, mode=null, dx=0;
  const W = () => pager.clientWidth;
  pager.addEventListener('pointerdown', e => { startX=e.clientX; startY=e.clientY; mode=null; dx=0; }, {passive:true});
  pager.addEventListener('pointermove', e => {
    if (e.pressure === 0 && e.pointerType === 'mouse') return;
    const mx=e.clientX-startX, my=e.clientY-startY;
    if (mode===null){
      if (Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)*1.2) mode='h';
      else if (Math.abs(my)>10) mode='v';
    }
    if (mode==='h'){
      dx=mx;
      if ((cur===0&&dx>0)||(cur===total-1&&dx<0)) dx=dx*.3;
      track.style.transition='none';
      track.style.transform=`translateX(calc(${-cur*100}% + ${dx}px))`;
    }
  }, {passive:true});
  const finish = () => {
    if (mode!=='h'){ mode=null; return; }
    const TH = Math.min(70, W()*.18);
    if (dx<-TH) goPage(cur+1);
    else if (dx>TH) goPage(cur-1);
    else goPage(cur);
    mode=null; dx=0;
  };
  pager.addEventListener('pointerup', finish, {passive:true});
  pager.addEventListener('pointercancel', finish, {passive:true});
})();
document.getElementById('tapPrev').addEventListener('click', ()=>goPage(cur-1));
document.getElementById('tapNext').addEventListener('click', ()=>goPage(cur+1));

/* 목차 */
document.getElementById('tocList').innerHTML = tocEntries.map(t =>
  `<div class="toc-item${t.locked ? ' locked' : ''}" onclick="jumpTo(${t.page-1})"><span class="n">${t.label}</span><span class="x">${t.title}</span><span class="p">${t.locked ? '封 · 잠김' : t.page + '장'}</span></div>`).join('');
function openToc(){ document.getElementById('tocOverlay').classList.add('on'); }
function closeToc(){ document.getElementById('tocOverlay').classList.remove('on'); }
function jumpTo(i){ closeToc(); goPage(i); }

/* 열람/갈무리 기록 (IP는 서버에서 캡처) */
function trackReport(event){
  try{
    fetch('https://lpjuanegereuzufjzgbq.supabase.co/functions/v1/track-view', {
      method:'POST', keepalive:true,
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        event, name:user.name,
        birth:`${user.birth.y}-${String(user.birth.m).padStart(2,'0')}-${String(user.birth.d).padStart(2,'0')}`,
        gender:user.gender, product:'hongdan', is_demo:!!(qs.get('demo') || qs.get('preview'))
      })
    }).catch(()=>{});
  }catch(e){}
}
trackReport('view');
function saveReport(){ trackReport('download'); window.print(); }
</script>
</body>
</html>
